models:
  - name: stg_jaffle_shop__customers
    description: test des colonnes de la table customers
    columns:
      - name: customer_id
        description: colonne clé primaire de la table customers
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description:  test des colonnes de la table orders
    columns:
      - name: order_id
        description:  colonne clé primaire de la table orders
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: customer_id
        description: colonne clé secondaire de la table orders faisant référence à la table customers
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
